<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Office</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #canvas { display: block; cursor: default; }
    #ui {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px; background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px); color: #fff; z-index: 10;
    }
    #ui h1 { font-size: 18px; color: #e8d5ff; letter-spacing: 1px; }
    #ui .stats { font-size: 13px; color: #aaa; }
    #chat-panel {
      position: fixed; bottom: 0; right: 0; width: 340px;
      background: rgba(10,10,30,0.92); backdrop-filter: blur(12px);
      border-left: 1px solid #2a2a5a; border-top: 1px solid #2a2a5a;
      display: flex; flex-direction: column; height: 380px; z-index: 10;
    }
    #chat-header {
      padding: 10px 14px; background: rgba(80,40,120,0.5);
      font-size: 13px; color: #e0c0ff; border-bottom: 1px solid #3a2a5a;
      display: flex; justify-content: space-between; align-items: center;
    }
    #chat-header span { font-size: 11px; color: #888; }
    #chat-messages {
      flex: 1; overflow-y: auto; padding: 10px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .msg { padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.5; max-width: 95%; }
    .msg.agent { background: rgba(80,40,120,0.4); color: #ddd; align-self: flex-start; border: 1px solid #3a2a6a; }
    .msg.user { background: rgba(40,80,160,0.4); color: #ddd; align-self: flex-end; border: 1px solid #2a4a8a; }
    .msg .name { font-size: 10px; color: #888; margin-bottom: 3px; }
    #chat-input-row { display: flex; padding: 8px; gap: 6px; border-top: 1px solid #2a2a5a; }
    #chat-input {
      flex: 1; background: rgba(255,255,255,0.07); border: 1px solid #3a3a6a;
      border-radius: 6px; padding: 6px 10px; color: #fff; font-size: 12px; outline: none;
    }
    #chat-input::placeholder { color: #555; }
    #chat-send {
      background: #6030a0; border: none; color: #fff; padding: 6px 12px;
      border-radius: 6px; cursor: pointer; font-size: 12px;
    }
    #chat-send:hover { background: #7040b0; }
    #agent-list {
      position: fixed; top: 60px; left: 16px;
      display: flex; flex-direction: column; gap: 6px; z-index: 10;
    }
    .agent-card {
      background: rgba(10,10,30,0.85); border: 1px solid #2a2a5a;
      border-radius: 8px; padding: 8px 12px; cursor: pointer;
      min-width: 150px; backdrop-filter: blur(8px);
      transition: border-color 0.2s;
    }
    .agent-card:hover { border-color: #6040a0; }
    .agent-card.selected { border-color: #9060e0; background: rgba(80,40,120,0.3); }
    .agent-card .agent-name { font-size: 12px; font-weight: 600; color: #e0c0ff; }
    .agent-card .agent-state { font-size: 10px; color: #888; margin-top: 2px; }
    .agent-card .agent-dot {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block; margin-right: 6px;
    }
    .thinking-indicator { display: inline-block; }
    .thinking-indicator::after {
      content: '...'; animation: dots 1.2s infinite;
    }
    @keyframes dots {
      0%,20% { content: '.'; }
      40%,60% { content: '..'; }
      80%,100% { content: '...'; }
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3a6a; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>🏢 CLAUDE HEADQUARTERS</h1>
    <div class="stats" id="stats">Agents: 0 | Tick: 0</div>
  </div>
  <canvas id="canvas"></canvas>
  <div id="agent-list"></div>
  <div id="chat-panel">
    <div id="chat-header">
      <span id="chat-agent-name">Select an agent to chat</span>
      <span id="chat-agent-status"></span>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input-row">
      <input id="chat-input" type="text" placeholder="Talk to the agent..." />
      <button id="chat-send">Send</button>
    </div>
  </div>
</body>
</html>
